name: Deploy inventory → Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/inventory/**'
      - 'libs/shared/**'
      - 'libs/catalog/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-inventory.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build inventory
        run: pnpm nx build inventory
        env:
          VITE_GRAPHQL_URL: ${{ secrets.VITE_GRAPHQL_URL }}
          NX_NO_CLOUD: true
          NX_DAEMON: false

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/inventory/dist --project-name=inventory-admin --branch=main
