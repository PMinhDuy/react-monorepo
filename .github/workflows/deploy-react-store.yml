name: Deploy react-store → Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/react-store/**'
      - 'libs/shared/**'
      - 'libs/products/**'
      - 'libs/orders/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-react-store.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build react-store
        run: pnpm nx build react-store
        env:
          VITE_GRAPHQL_URL: ${{ secrets.VITE_GRAPHQL_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/react-store/dist --project-name=react-store --branch=main
